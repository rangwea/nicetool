[project]
name = "nicetool"
version = "0.1.0"
description = "NiceTool platform built with FastAPI and NiceGUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.0",
    "nicegui>=3.11.0",
    "httpx>=0.28.0",
    "pymongo<=3.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.12.0",
    "sqlmodel>=0.0.14",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
    "PyJWT[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.5",
]
