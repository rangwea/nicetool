# NiceTool



一站式 AI 工具平台，让想法成为团队可用的工具。

用自然语言描述需求，让 AI 创建工具，在浏览器中预览验证，再发布到团队的工具中心。NiceTool 将数据接入、工具生成、预览调试、发布共享、版本管理和访问授权串成完整流程，让工具从一次性的需求变成可以持续使用和改进的团队资源。

使用者只需关注要解决什么问题、结果是否正确，无需了解工具的底层语言。创建者通过接入 NiceTool Skill 的 AI 编程助手描述需求、调整功能；团队成员通过浏览器直接使用已发布的工具。

## 从需求到可用工具

1. **描述需求**：告诉 AI 需要查询哪些数据、完成什么操作、如何展示结果。
2. **生成工具**：AI 结合项目上下文、已配置的数据源和开发规范创建工具。
3. **预览调整**：打开预览页面验证效果，继续用自然语言提出修改；AI 可读取日志排查问题。
4. **发布共享**：确认结果后发布到工具中心，为需要的成员分配项目访问权限。
5. **持续改进**：根据反馈迭代工具，通过版本和日志管理后续维护。

AI 创建和修改工具通过外部 AI 编程助手与 Skill 完成；NiceTool 提供工具运行、预览、发布及团队管理服务。

## 可以用 NiceTool 做什么

| 场景 | 示例 |
| --- | --- |
| 数据查询 | 按订单号、状态和日期筛选记录，查看分页明细 |
| 业务操作 | 创建信息维护表单、批量处理和日常管理工具 |
| 统计分析 | 汇总业务指标，生成趋势图、分析面板和导出报表 |
| 团队协作 | 集中发布工具，按项目授权，让成员通过统一入口使用 |

## 平台能力

- **AI 驱动创建**：通过 NiceTool Skill 将自然语言需求转化为工具，支持连续修改和调试。
- **完整发布流程**：从预览验证到正式发布，提供版本记录、回滚和日志查看。
- **统一工具中心**：按项目组织工具，支持浏览、搜索、筛选和直接运行。
- **共享数据能力**：集中管理 MySQL、MongoDB 数据源、平台变量和枚举，供工具复用。
- **团队访问管理**：支持内置账号、OIDC/OAuth2、个人 Token 和用户项目授权。
- **只读分析能力**：NiceTool Skill 支持数据查询、图表、仪表盘及有数量上限的导出。

## 一键体验

只需 Docker 和 Compose v2，即可启动包含合成数据的完整演示：

```bash
sh scripts/demo.sh
```

打开 [工具中心](http://localhost:8000/user)，体验订单查询、销售看板和报价计算器。无需安装 Python、准备数据库或配置模型密钥。

接着按[完整 AI 创建示例](#demo)让你的 AI 助手创建新工具、根据反馈修改并发布。演示仅允许本机访问，全部数据均为合成数据。

## 创建你的第一个 AI 工具

已有 NiceTool 实例时，先在工作项目中[安装 NiceTool Skill](#nicetool-skill)并完成账号授权，再向支持 Skill 的 AI 编程助手描述需求：

> 创建一个订单查询工具，使用已配置的订单数据源，支持按订单号、日期和状态筛选，分页展示结果。先生成预览，不发布。

打开 AI 返回的预览地址，验证后继续调整：

> 增加订单金额汇总，并支持导出当前筛选结果，最多导出 1000 条。

确认效果和目标实例后发布：

> 将已验证的工具发布到订单项目，并核对正式状态。

管理员为成员分配项目访问权限后，成员即可从工具中心打开使用。普通使用者无需安装开发环境，也无需编写代码。发布需要相应权限；更多示例见[开发任务示例](#nicetool-skill-usage)。

## 部署自己的平台

准备 Python 3.13+、uv 和一个可访问的 MySQL 实例。下载本仓库后，在仓库根目录执行：

```bash
uv sync --locked
```

先在 MySQL 中创建数据库，为应用账号授予该数据库的建表和读写权限：

```sql
CREATE DATABASE nicetool CHARACTER SET utf8mb4;
```

参考 `.env.example` 创建或编辑根目录 `.env`，将以下示例值替换为本地配置；已有 `.env` 时先备份，不直接覆盖：

```dotenv
HOST=0.0.0.0
PORT=8000
MYSQL_HOST=127.0.0.1
MYSQL_PORT=3306
MYSQL_USER=nicetool
MYSQL_PASSWORD=replace-with-your-password
MYSQL_DATABASE=nicetool
STORAGE_SECRET=replace-with-a-random-secret
AUTH_ENABLED=true
AUTH_JWT_SECRET=replace-with-another-random-secret
```

可用 `uv run python -c "import secrets; print(secrets.token_urlsafe(32))"` 生成密钥。不要将实际凭据提交到版本控制。

```bash
uv run main.py
```

启动时创建缺失的数据表，并从数据库恢复工具缓存。访问 [登录页](http://localhost:8000/auth/login)初始化管理员，再进入[管理后台](http://localhost:8000/admin)配置用户和数据源。

| 入口 | 默认地址 |
| --- | --- |
| 首页 | <http://localhost:8000> |
| 工具中心 | <http://localhost:8000/user> |
| 管理后台 | <http://localhost:8000/admin> |
| API 文档 | <http://localhost:8000/docs> |
| 健康检查 | <http://localhost:8000/health> |

### Docker 部署

```bash
docker build -t nicetool .
docker run -d --name nicetool --env-file .env -p 8000:8000 nicetool
```

镜像包含平台运行环境，通过 uv 按 `uv.lock` 安装依赖。容器内的 `MYSQL_HOST` 必须指向容器可访问的数据库地址。镜像排除 `.env` 和环境专用配置，运行时通过环境变量注入。持久化、反向代理及升级说明见[部署指南](#deployment)。

# CLI 与 Skill

[返回文档索引](#README)

CLI 位于 `plugins/nicetool/skills/nicetool/scripts/tool-cli.py`。本仓库使用 `uv run python` 执行；Skill 正式源位于 `plugins/nicetool/skills/nicetool`，项目内 `.agents/skills/nicetool` 是符号链接。

## 从实例安装 Skill

先由管理员在环境管理中设置启用环境及默认环境。确认实例可信后，在目标项目目录执行：

```bash
curl -fsSL https://tools.example.com/api/install.sh | sh
```

安装脚本下载 Skill、初始化客户端配置，并打开浏览器请求授权。默认可交互选择安装到当前项目或全局目录；无交互环境使用 `--local` 或 `--global`。参数 `--target /path/to/project` 指定项目；`--force` 替换已有 Skill；`--skip-auth` 跳过浏览器授权。已有客户端配置保留。

```bash
# 安装到当前项目
curl -fsSL https://tools.example.com/api/install.sh | sh -s -- --local

# 安装到用户级全局目录
curl -fsSL https://tools.example.com/api/install.sh | sh -s -- --global
```

```bash
curl -fsSL https://tools.example.com/api/install.sh   | sh -s -- --target /path/to/project --skip-auth
```

也可手动复制完整的 `plugins/nicetool/skills/nicetool` 目录到 Agent 支持的 Skill 搜索目录。保留其中的脚本和参考资料，不要只复制 `SKILL.md`。

## 连接实例

直接使用仓库中的 CLI：

```bash
export NICETOOL_TOKEN='replace-with-your-token'
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py   --server http://localhost:8000 list
```

已安装到目标项目时，将脚本路径换为 `.agents/skills/nicetool/scripts/tool-cli.py`。

多实例可执行 `/api/init.sh` 初始化配置，然后通过 `--env <名称>` 选择环境，或用 `--config <路径>` 指定 TOML。环境名称、URL、`token_env` 来自后台环境管理，不固定为 test/prod。

## 开发流程

以下命令在仓库根目录执行。远端操作复用同一 Server 地址；启用认证时需要先配置 Token。

```bash
# 只创建本地文件
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py create demo hello

# 创建固定预览
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py   --server http://localhost:8000 preview demo hello --file tools/demo/hello.py

# 查看预览日志
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py   --server http://localhost:8000 prelog demo hello

# 上传并发布正式版本
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py   --server http://localhost:8000 publish demo hello --file tools/demo/hello.py

# 查询正式状态
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py   --server http://localhost:8000 status demo hello
```

发布需要相应操作权限。`create` 不调用服务端；`preview` 不更新正式版本，但会执行工具代码；`publish` 写入正式源码版本。

## 常用命令

| 命令 | 用途 |
| --- | --- |
| `list` / `projects` | 列出可访问的工具或项目 |
| `get <project> <name>` | 读取工具详情 |
| `create <project> <name>` | 本地生成工具 |
| `preview --file <path>` | 临时预览 |
| `publish <project> <name> --file <path>` | 上传并发布 |
| `status <project> <name>` | 正式状态 |
| `toollog` / `prelog` | 正式日志 / 预览日志 |
| `databases` / `variables` | 查看可用配置元信息 |
| `delete <project> <name>` | 删除正式工具 |

全局参数放在子命令前。完整参数通过 `--help` 或 `<命令> --help` 查看。删除和发布前确认实例、项目及文件名；Agent 的操作还应遵守所安装 Skill 的授权规则。

# 开发任务示例

[返回文档索引](#README)

先完成[Skill 安装和实例连接](#nicetool-skill)，再向开发助手说明数据源、输入条件、结果字段和操作范围。以下项目名均为示例。

## 查询工具

> 在 demo 项目创建订单查询工具。按订单号和日期筛选，使用已登记的数据源，分页显示结果。先生成本地文件，不发布。

## 修改工具

> 读取 demo/order_query 当前源码，增加状态筛选。复用已有枚举，保留分页。修改后预览并检查日志。

## 预览排错

> demo/order_query 的预览页面报错。读取对应预览日志，定位原因，修复后重新预览。

## 发布

> 将已验证的本地 tools/demo/order_query.py 发布到指定实例的 demo/order_query，并核对正式状态。

发布前明确实例地址或命名环境。使用普通用户账号时，先确认具备发布权限。

## 分析面板

> 使用 NiceTool Skill 创建月度订单数量和金额趋势面板，支持日期范围、分页明细和有数量上限的 Excel 导出。

只读分析与业务写操作均使用 NiceTool Skill。写操作需要明确字段校验、确认交互、事务和失败处理。

# 先体验：AI 可以帮你创建什么

只需 Docker 和 Compose v2，不需要安装 Python、准备数据库或配置模型密钥。先体验三个成品工具，再让你使用的 AI 助手继续修改。

## 一键启动

在仓库根目录执行：

```bash
sh scripts/demo.sh
```

英文界面请在 `.env` 文件中设置 `LANGUAGE=en-US`，再运行 `sh scripts/demo.sh`。

首次启动需要网络下载镜像与依赖。脚本等待数据库和平台就绪后，输出工具中心地址：

[打开演示工具中心](http://localhost:8000/user)

端口被占用时：

```bash
DEMO_PORT=8080 sh scripts/demo.sh
```

演示独立使用 `nicetool_demo` 数据库和 Docker 卷；`.env` 中的语言配置用于界面，数据库连接和认证使用固定的演示配置。默认关闭登录，只绑定 `127.0.0.1`。它用于本机体验，不是正式部署配置，也不适合通过代理暴露到公网。

## 三个可直接使用的工具

| 工具 | 试一试 | 应看到的结果 |
| --- | --- | --- |
| [订单查询](http://localhost:8000/user/tools/demo/order_query) | 输入 `DEMO-001` 后查询 | 一条示例客户订单；支持分页与 CSV 导出 |
| [销售看板](http://localhost:8000/user/tools/demo/sales_dashboard) | 查看指标及六个月趋势 | 60 条订单、20 条已完成订单；销售额只统计已完成订单 |
| [报价计算器](http://localhost:8000/user/tools/demo/quote_calculator) | 数量 10、单价 99、折扣 10% | 报价 891.00 元；不保存任何业务数据 |

全部订单为固定合成数据，来源是 `examples/demo/orders.csv`。无需连接真实业务系统。三个工具是预置示例，不表示平台已在后台调用模型生成；修改和生成需要你的外部 AI 助手。

## 让 AI 修改一个工具

在支持项目 Skill 的 AI 编程助手中打开本仓库。仓库已经包含 NiceTool Skill；若工具未自动发现它，可明确要求读取 `plugins/nicetool/skills/nicetool/SKILL.md`。

给 AI 以下任务：

> 使用 NiceTool Skill，基于当前演示项目创建一个新工具 demo/order_analysis。参考 examples/demo/tools/order_query.py，读取 examples/demo/orders.csv，支持订单状态筛选，显示订单数量和已完成订单金额。不要修改现有三个演示工具。目标实例是 http://localhost:8000，先预览，不发布。

业务口径见 [演示数据说明](#project)。若使用了其他端口，请同步替换任务中的实例地址。

验证预览后继续：

> 增加按月汇总图表。金额只统计已完成订单，取消订单不计入，保留无订单月份的展示。修改后重新预览，并说明你验证了哪些输入和结果。

确认结果后发布：

> 将这次已验证的候选源码发布到本机演示实例的 demo/order_analysis，并核对正式页面和版本。

演示实例关闭鉴权，不需要个人 Token，也不需要浏览器授权。若要把 Skill 安装到另一个业务项目，安装时使用 `--skip-auth`；这些示例依赖本仓库的 `examples.demo.data`，因此本教程应在当前仓库内完成。

## 停止、重启和重置

停止并保留数据库和修改：

```bash
docker compose --env-file /dev/null -f compose.demo.yaml down
```

再次运行 `sh scripts/demo.sh` 即可启动。初始化会创建缺失的示例工具；源码与预置文件不同时会写入新版本，因此重新启动可能覆盖你对三个预置工具的修改。源码相同则跳过。请使用新工具名保存自己的改动；已删除的预置示例会在下次启动时重新创建。默认客户端环境仅在列表为空时创建，已有配置保留。

完全删除演示数据库、工具修改、日志及预览，再从头体验：

```bash
# 破坏性操作，仅在确定不要现有演示内容时执行。
docker compose --env-file /dev/null -f compose.demo.yaml down --volumes
sh scripts/demo.sh
```

## 排查启动问题

```bash
docker compose --env-file /dev/null -f compose.demo.yaml ps
docker compose --env-file /dev/null -f compose.demo.yaml logs --tail 80 app db
```

本机有 Python 时，可运行脱敏诊断：

```bash
python3 scripts/doctor.py --server http://localhost:8000
```

成功退出码为 0，检查失败为 1。诊断不读取 `.env`，不输出 Token、数据库密码或 HTTP 响应正文。健康接口仅表示 HTTP 服务存活，不能替代数据库与工具功能验收。

正式使用请阅读[部署指南](#deployment)，从 `.env.example` 配置自己的数据库和登录密钥。

# 用户与管理员指南

[返回文档索引](#README)

## 首次登录

启用 `AUTH_ENABLED=true` 后，访问 `/auth/login`。没有本地密码账号时，页面提供管理员初始化；初始化完成后，其他本地账号由管理员创建。使用临时密码登录的用户需要先修改密码。

## 使用工具

在 `/user` 按项目、标签或关键词查找工具。普通用户只能看到获授权的项目；管理员不受项目范围限制。点击工具进入 `/user/tools/{project}/{name}`。

看不到工具时，先确认工具已发布，再请管理员检查你的项目授权。预览成功不代表已经发布。

## 管理后台

`/admin` 提供以下入口：

| 入口 | 用途 |
| --- | --- |
| 用户管理 | 创建账号、禁用账号、重置密码和分配项目访问权限 |
| 工具管理 | 查看工具、源码及版本，执行有权限的管理操作 |
| 数据源管理 | 配置 MySQL/MongoDB 连接并测试连接 |
| 枚举管理 | 管理供工具使用的枚举 |
| 变量管理 | 配置工具读取的字符串 Key-Value |
| NiceTool 环境管理 | 为 CLI/安装脚本登记实例 URL、Token 环境变量名和默认环境 |
| 预览日志 | 查看预览列表及运行日志 |

环境管理不创建 Server 实例，也不修改服务的 `.env`。要生成客户端初始化配置，需要至少一个启用环境，并指定一个默认环境。

## 发布流程

开发者先在本地编写工具，通过预览验证，再由有权限的账号正式发布。数据库保存发布版本，工具中心使用正式版本。项目授权决定普通用户能访问哪些项目，不赋予发布、删除或回滚权限。

## Token

右上角用户菜单提供个人 Token 管理。完整 Token 只显示一次，丢失后重新生成；不再使用时撤销。配置方法见[Token 指南](#nicetool-token-setup)。

## 常见问题

- **401**：浏览器会话或 CLI Token 无效、过期，重新登录或生成 Token。
- **403**：检查账号是否禁用、是否需要修改临时密码，以及项目授权和操作权限。
- **工具缺少入口**：工具必须定义顶层同步或异步 `main()`。
- **数据源连接失败**：从服务所在主机或容器检查地址、网络和数据库权限。
- **安装脚本返回 503**：检查后台是否配置了启用的默认环境，Skill 分发文件是否完整。

管理员可结合 `logs/app.log`、`logs/error.log`、`logs/tools/{project}/{tool}/tool.log` 和预览日志定位问题。分享日志前移除凭据与业务数据。

# 配置参考

[返回文档索引](#README)

配置由 `core/settings.py` 的 Pydantic Settings 读取，环境变量名不区分大小写。进程环境变量优先于 dotenv 文件；修改启动配置后需要重启服务。

## 配置文件选择

- 设置 `ENV_FILE` 时，读取指定文件；支持逗号分隔的多个路径，后面的文件覆盖前面的值。
- 未设置 `ENV_FILE` 时，先读取 `.env`，再读取 `.env.${ENV_TYPE}`。
- `ENV_TYPE` 默认 `prod`，仅接受 `dev`、`uat`、`prod`；对应文件不存在时不会自动生成。
- 仓库仍保留 `.env.dev`。若只想加载 `.env`，使用 `ENV_FILE=.env uv run main.py`。

不要将 Server 的 `ENV_TYPE` 与 CLI 的 `--env` 混淆：前者选择服务启动配置，后者选择远端实例。

## 服务与数据库

| 变量 | 默认值 | 说明 |
| --- | --- | --- |
| `HOST` | `0.0.0.0` | 监听地址 |
| `PORT` | `8000` | 监听端口 |
| `PROJECT_PATH` | 空 | URL 挂载前缀，例如 `/nicetool` |
| `LANGUAGE` | `zh-CN` | 在 `.env` 配置的全局界面语言，支持 `zh-CN` / `en-US`；修改后重启生效 |
| `STORAGE_SECRET` | 内置开发值 | 会话存储密钥，部署时替换 |
| `LOG_LEVEL` | `INFO` | 日志级别 |
| `TOOLS_DIR` | `./tools` | 可重建的工具运行缓存目录 |
| `MYSQL_HOST` | `localhost` | 平台数据库主机 |
| `MYSQL_PORT` | `3306` | 平台数据库端口 |
| `MYSQL_USER` | `root` | 数据库用户 |
| `MYSQL_PASSWORD` | 空 | 数据库密码 |
| `MYSQL_DATABASE` | `nicetool` | 已创建的数据库名 |
| `MYSQL_CHARSET` | `utf8mb4` | 连接字符集 |
| `MYSQL_POOL_SIZE` | `10` | 常驻连接池大小 |
| `MYSQL_MAX_OVERFLOW` | `20` | 额外连接数上限 |
| `MYSQL_POOL_TIMEOUT` | `30` | 等待连接的超时秒数 |
| `MYSQL_POOL_RECYCLE` | `3600` | 连接回收周期秒数 |
| `REQUEST_TIMEOUT` | `30` | 认证 HTTP 请求超时秒数 |

平台 MySQL 保存工具版本、账号和管理配置。工具访问的业务数据源在管理后台单独配置，不通过这些 `MYSQL_*` 变量选择。

## 登录

`AUTH_ENABLED` 默认 `false`。启用后配置 `AUTH_JWT_SECRET`；HTTPS 部署设置 `AUTH_REQUIRE_HTTPS_COOKIE=true`。完整配置见[认证与权限](#oauth2-auth)。

## 样式与配置入口

平台使用 `core/styles.py` 的固定样式，没有主题切换和通用设置保存页面。服务配置通过环境变量管理；数据源、变量、枚举和客户端环境通过各自的后台页面管理。

# 部署指南

[返回文档索引](#README)

## 本地运行

按照[快速开始](#project)准备 Python 3.13+、uv 和 MySQL。执行 `uv sync --locked` 安装锁定依赖，再执行 `uv run main.py`。MySQL 数据库需预先创建；启动建表只创建缺失的表，不负责变更已有表的列或索引。

## Docker

仓库的 `Dockerfile` 构建包含源码的应用镜像，使用 uv 安装锁定依赖到 `/opt/venv`，通过该环境的 Python 启动服务。

```bash
docker build -t nicetool .
docker run -d --name nicetool   --env-file .env   -p 8000:8000   -v nicetool-logs:/app/logs   -v nicetool-previews:/tmp/nicegui_client_tools   nicetool
```

`.dockerignore` 排除 `.env`、`.env.*` 中的真实配置，仅保留 `.env.example`。运行时使用 `--env-file` 或部署平台的环境变量配置。镜像健康检查使用配置的端口和挂载前缀访问 `/health`。

容器内 `localhost` 指向容器自身。数据库在其他容器时，使用同一 Docker 网络中的服务名；在宿主机时，使用该运行环境支持的宿主机地址。不要直接沿用本机开发的 `MYSQL_HOST=127.0.0.1`。

```bash
docker logs -f nicetool
docker stop nicetool
```

## 数据持久化

| 内容 | 位置 | 恢复方式 |
| --- | --- | --- |
| 工具源码与版本、用户、平台配置 | MySQL | 数据库备份恢复 |
| 正式工具运行文件 | `TOOLS_DIR` | 启动时从数据库恢复 |
| 预览代码与日志 | `/tmp/nicegui_client_tools` | 重新预览或挂载卷 |
| 应用及正式工具日志 | `logs/` | 挂载卷或外部日志系统 |

只备份 `tools/` 不足以恢复平台。应备份 MySQL，并单独保存运行配置及密钥。

## 反向代理与子路径

设置 `PROJECT_PATH=/nicetool` 后，页面、API 和登录回调都包含此前缀。反向代理应保留前缀、支持 WebSocket，并传递正确的外部协议与主机信息。OIDC/OAuth2 的回调地址应与外部 URL 一致，例如 `https://tools.example.com/nicetool/auth/callback`。

HTTPS 部署启用 `AUTH_REQUIRE_HTTPS_COOKIE=true`；本机 HTTP 开发保持 `false`。配置独立的 `STORAGE_SECRET` 和 `AUTH_JWT_SECRET`，再开放受保护入口。

## 升级

1. 备份数据库与运行配置，记录当前代码提交或镜像版本。
2. 检查 `models/`、`scripts/init.sql` 和发布变更，评估已有表的迁移需求。
3. 用新的 `uv.lock` 安装依赖或重建镜像。
4. 停止旧实例，应用经过验证的数据库变更，再启动新实例。
5. 检查 `/health`，并验证登录、工具预览和已发布工具。

`scripts/init.sql` 是完整建表脚本，不是增量迁移工具。回滚涉及数据库结构时，需要与备份配套，不能仅切换代码。

## 已知部署边界

工具模块在服务进程内导入执行，不是沙箱；只允许可信开发者发布。预览文件及运行缓存依赖本地文件系统，多实例部署需要额外设计共享存储和请求路由。

首次体验见[一键演示](#demo)，详细升级步骤见[升级与恢复](#upgrading)。

# 升级与恢复

[返回文档索引](#README)

## 演示环境

更新代码后重新执行 `sh scripts/demo.sh`。数据库卷保留，但演示初始化会将内容不同的预置工具写为新版本，可能覆盖你对这三个工具的修改。请将自定义改动保存为其他工具名。重置会删除演示环境中的全部修改，命令见[演示指南](#demo)。

## 当前开发契约

项目尚未上线，接口调整直接同步服务端、CLI、Skill 和文档，不保留旧行为兼容入口。发布必须上传源码，工具名称严格校验；详见 [API 导航](#api)。

## 正式部署

1. 记录当前代码提交与镜像版本，备份 MySQL 和运行配置。
2. 对比新旧 `models/` 与 `scripts/init.sql`。建表脚本不是增量迁移工具；启动的 `create_tables()` 不会为已有表自动修改列和索引。
3. 在隔离数据库上验证所需的结构迁移和数据恢复。
4. 使用新的 `uv.lock` 重建镜像，明确注入正式配置。
5. 停止旧实例，执行已经验证的迁移，启动新实例。
6. 验证登录、项目权限、工具预览、发布、运行及日志。

HTTP `/health` 返回 `OK` 只是存活检查。还应实际运行一个使用数据源的工具。

## 回滚

如果仅更换了应用代码，可切回记录的镜像。涉及不兼容数据库变更时，需恢复配套数据库备份，不能只回滚代码。工具版本回滚只恢复工具源码，不撤销工具已经产生的业务数据写入。

## 诊断与反馈

可先运行 `python3 scripts/doctor.py --server <实例地址>`。提交问题时附上提交版本、部署方式、诊断输出、复现步骤和脱敏日志，不要附上真实 `.env`、Token 或数据库备份。

# 工具开发

[返回文档索引](#README)

## 文件与入口

工具是单个 Python 文件，通过项目名和文件名定位，例如 `demo/hello.py`。`name` 元数据是显示标题，URL 中的工具名是文件名去掉 `.py`。

```python
"""name: Hello NiceTool
description: 演示交互输入
creator: contributor
tags: demo
"""

from nicegui import ui


def main():
    with ui.column().classes("w-full gap-4"):
        ui.label("Hello NiceTool").classes("text-xl font-semibold")
        ui.button("点击", on_click=lambda: ui.notify("操作成功"))


if __name__ == "__main__":
    main()
    ui.run()
```

支持 `def main()` 与 `async def main()`。UI 构建放进 `main()`，`ui.run()` 只能位于本地启动保护块中。模块导入时会执行顶层语句，应避免顶层网络请求和写操作；不再支持没有 `main()` 的旧式顶层 UI 脚本。

平台要求调用入口无需传参。保持入口直接、无装饰器，便于预览和正式执行采用相同逻辑。

## 数据与共享配置

业务数据库连接通过 `core.datasource_manager` 管理，平台变量通过 `core.variable_manager` 读取。使用之前先由管理员登记配置；不要在工具源码中硬编码真实连接密码或 Token。

枚举使用 `core.enum_config` 中的 `get_enum_values()`、`enum_options()` 等接口。具体接口可查看源码与 Skill 参考文件。

耗时查询避免阻塞 UI 事件循环；查询列表应有筛选和分页，导出应有数量上限。事务、参数校验和业务写入权限由工具开发者负责实现。

## 生命周期

1. 本地创建文件，或使用 CLI `create`。
2. 使用 `preview` 验证 UI、查询和异常处理。
3. 使用 `prelog` 查看预览错误。
4. 确认目标项目与实例，使用 `publish` 上传源码。
5. 使用 `status` 核对正式版本，并打开正式地址。

命令示例见[CLI 指南](#nicetool-skill)。预览执行也会运行真实 Python 代码，不自动回滚工具对业务数据的写入。

## 平台实现

- `service/tool_metadata.py`：模块 docstring 元数据解析。
- `service/tool_runtime.py`：入口校验和模块加载。
- `service/tool_storage.py`：MySQL 源码版本与运行缓存恢复。
- `service/tool_lifecycle_service.py`：发布、回滚、删除及操作记录。

正式内容以数据库为准，不要把手工修改运行缓存当成发布。

## 工具名称与源码契约

项目名和工具名仅允许小写字母、数字、下划线和连字符；项目名最长 100 个字符，工具名最长 197 个字符。工具名不包含 `.py`。平台不会自动转小写、替换空格或剥离扩展名；非法名称会被拒绝，API 返回 HTTP 422。工具标题可使用中文，与工具标识符分开。

发布必须上传包含顶层 `main()` 的 Python 源码。`POST /api/tools/{project}/{name}/publish` 必须携带 JSON 请求体 `{"content": "..."}`；缺失请求体、缺失 content 或空字符串返回 HTTP 422。源码语法或入口错误返回 HTTP 400。CLI 默认读取本地 `tools/{project}/{name}.py` 并上传，也可使用 `--file` 或 `--stdin`。服务端不会从当前数据库版本或本地运行缓存推断待发布内容。

MySQL 保存正式源码和版本，本地 `tools/` 仅作为可恢复的运行缓存。恢复历史源码请在后台使用版本回滚，它会创建新版本。工具详情不返回 revision，CLI `get --output` 仅写入源码文件；平台未提供乐观锁冲突保护。

# API 导航

[返回文档索引](#README)

启动服务后，通过 `/docs` 查看 Swagger，`/redoc` 查看 ReDoc，`/openapi.json` 获取接口 Schema。子路径部署时添加 `PROJECT_PATH`。请求字段、响应结构与错误码以运行实例的 Schema 和实现为准。

## 接口分组

| 路径 | 用途 | 源码 |
| --- | --- | --- |
| `/api/tools` | 工具列表、详情、预览、发布、状态、日志和删除 | `public/api/tool_api.py` |
| `/api/datasources` | 数据源查询与连接测试 | `public/api/datasource_api.py` |
| `/api/variables` | 平台变量 Key 列表 | `public/api/variable_api.py` |
| `/auth` | 登录、账号初始化、个人 Token 和设备授权 | `public/api/auth_api.py` |
| `/api/init.sh`、`/api/install.sh` | 客户端初始化与安装 | `public/init_script.py` |
| `/api/downloads` | Skill ZIP 下载 | `public/skill_download.py` |
| `/health` | 健康检查 | `public/api/health_api.py` |

不是所有后台操作都有对应 REST CRUD 接口。枚举、用户项目授权等后台功能可直接调用服务层；不要推断未声明的端点。

## 读取工具

```bash
curl --fail-with-body http://localhost:8000/api/tools   -H "Authorization: Bearer $NICETOOL_TOKEN"
```

启用认证时，Token 和账号状态参与访问检查；工具列表受项目授权限制。

## 上传并发布

```bash
uv run python -c 'import json; from pathlib import Path; print(json.dumps({"content": Path("hello.py").read_text()}))'   | curl --fail-with-body -X POST http://localhost:8000/api/tools/demo/hello/publish       -H "Authorization: Bearer $NICETOOL_TOKEN"       -H 'Content-Type: application/json' --data-binary @-
```

该操作写入正式版本，需要发布权限。建议先用 CLI 预览。临时预览端点为 `POST /api/tools/preview`，同样接收包含 `content` 的 JSON。

## 访问与集成边界

普通页面通过 Cookie 登录，CLI 使用 Bearer Token。预览 URL 默认处于公共路径范围，不应将其当作私有数据隔离机制。对接时同时核对路径保护、项目授权与操作 scope；参见[认证说明](#oauth2-auth)。

## 工具名称与源码契约

项目名和工具名仅允许小写字母、数字、下划线和连字符；项目名最长 100 个字符，工具名最长 197 个字符。工具名不包含 `.py`。平台不会自动转小写、替换空格或剥离扩展名；非法名称会被拒绝，API 返回 HTTP 422。工具标题可使用中文，与工具标识符分开。

发布必须上传包含顶层 `main()` 的 Python 源码。`POST /api/tools/{project}/{name}/publish` 必须携带 JSON 请求体 `{"content": "..."}`；缺失请求体、缺失 content 或空字符串返回 HTTP 422。源码语法或入口错误返回 HTTP 400。CLI 默认读取本地 `tools/{project}/{name}.py` 并上传，也可使用 `--file` 或 `--stdin`。服务端不会从当前数据库版本或本地运行缓存推断待发布内容。

MySQL 保存正式源码和版本，本地 `tools/` 仅作为可恢复的运行缓存。恢复历史源码请在后台使用版本回滚，它会创建新版本。工具详情不返回 revision，CLI `get --output` 仅写入源码文件；平台未提供乐观锁冲突保护。

    </script>

# 国际化

平台界面语言统一在项目根目录的 `.env` 文件中配置，支持简体中文（`zh-CN`）和 English（`en-US`）。页面不提供语言切换，浏览器 Cookie 和语言偏好不会覆盖此配置。

```dotenv
LANGUAGE=en-US
```

修改文件后重启应用，所有页面、登录页面和 NiceGUI 内置组件统一使用配置的语言。使用 `zh-CN` 可切换为中文。

Demo 同样从 `.env` 读取语言；文件不存在时使用 `.env.example` 的中文默认值。修改后重新运行：

```bash
sh scripts/demo.sh
```

脚本仅将 Compose 明确引用的配置用于演示，数据库和认证仍使用独立演示配置，不会连接 `.env` 中的业务数据库。不需要在启动命令中指定语言。

覆盖范围包括平台导航、管理表单、表格、主要通知，以及账号初始化、登录、改密和设备授权页面。项目名称、工具标题、描述、业务数据、枚举值和工具脚本自身的界面不自动翻译。日志、第三方异常、服务层原始错误和 API 文档仍保留原文。

## 添加平台文案

中文原文作为翻译键，英文目录位于 `core/i18n/en-US.json`。在页面渲染或回调中调用翻译，避免模块导入时固化语言：

```python
from core.i18n import t, option_labels

ui.label(t("工具中心"))
ui.label(t("项目授权：{arg0}", arg0=username))
ui.select(option_labels({"user": "普通用户", "admin": "管理员"}), value="user")
```

动态值通过命名占位符传入；英文翻译必须保留同名占位符及格式。不要翻译下拉框的机器值、数据库字段或用户输入。未找到翻译时显示中文原文。

平台 NiceGUI 页面使用 `component.language.localized_page`，由它读取统一配置并设置内置组件语言。静态表格插槽可使用 `html_t()` 翻译文字及显示表达式中的字面量，它不处理工具或用户提供的 HTML，也不替代 HTML 转义。

新增其他语言时，需要添加翻译目录，并扩展 `core.i18n` 的语言规范化和目录加载，同时确认 NiceGUI 支持目标语言。

验证：

```bash
uv run python -m unittest discover -s tests -p test_i18n.py
```

    <script type="text/markdown" id="doc-zh-CN-oauth2-auth">
# 认证与项目权限

[返回文档索引](#README)

## 本地账号

```dotenv
AUTH_ENABLED=true
AUTH_JWT_SECRET=replace-with-a-random-secret
AUTH_JWT_EXPIRES_MINUTES=30
AUTH_REQUIRE_HTTPS_COOKIE=false
```

没有本地密码账号时，`/auth/login` 提供管理员初始化。之后由管理员创建用户，临时密码需要首次登录后修改。网页使用 HttpOnly Cookie 保存短期 JWT；到期后重新登录，不提供 Refresh Token。HTTPS 部署将 `AUTH_REQUIRE_HTTPS_COOKIE` 设为 `true`。

认证默认关闭。关闭时不应用通常的用户和项目访问限制，适合本机调试，不应当作多用户权限配置。

## OIDC

```dotenv
AUTH_PROVIDER_PROFILE=oidc
AUTH_PROVIDER_NAME=example-sso
AUTH_ISSUER=https://id.example.com
AUTH_CLIENT_ID=replace-with-client-id
AUTH_CLIENT_SECRET=replace-with-client-secret
AUTH_REDIRECT_URI=https://tools.example.com/auth/callback
AUTH_SCOPES="openid profile email"
```

服务通过 discovery 获取元数据，通过 JWKS 校验 ID Token。配置了客户端 ID 与密钥后，登录页提供外部登录入口。子路径部署时回调 URL 也要包含前缀。

## OAuth2

```dotenv
AUTH_PROVIDER_PROFILE=oauth2
AUTH_PROVIDER_NAME=example-oauth
AUTH_AUTHORIZATION_ENDPOINT=https://id.example.com/oauth/authorize
AUTH_TOKEN_ENDPOINT=https://id.example.com/oauth/token
AUTH_USERINFO_ENDPOINT=https://id.example.com/api/user
AUTH_CLIENT_ID=replace-with-client-id
AUTH_CLIENT_SECRET=replace-with-client-secret
AUTH_REDIRECT_URI=https://tools.example.com/auth/callback
AUTH_SCOPES="profile email"
```

通用 OAuth2 需要三个显式端点。字段通过 `AUTH_USER_ID_CLAIM`、`AUTH_USERNAME_CLAIM`、`AUTH_EMAIL_CLAIM`、`AUTH_DISPLAY_NAME_CLAIM` 和 `AUTH_GROUPS_CLAIM` 映射。仅可信邮箱验证字段匹配时才按邮箱绑定已有账号。

源码还支持 `enterprise_oa` 专用字段适配，使用 `AUTH_ENTERPRISE_OA_BASE_URL`；新接入优先使用通用配置。企业网关 X-Token 登录已移除。

## 权限模型

权限分成项目范围与操作范围：

| 账号 | 项目范围 | 默认生命周期操作 |
| --- | --- | --- |
| 管理员 | 全部项目 | 读取、预览、发布、回滚、删除、管理 |
| 普通用户 | 管理员分配的项目 | 读取、预览 |

管理员在用户管理中整体设置普通用户的项目授权；未授权的普通用户不能浏览对应正式工具。Token 还受签发的 scope 限制，项目授权不是发布授权。

`AUTH_ADMIN_USERS` 和 `AUTH_ADMIN_GROUPS` 用于外部登录角色判定。`AUTH_PROTECTED_PATHS`、`AUTH_ADMIN_PATHS`、`AUTH_PUBLIC_PATHS` 调整路径保护，修改时应核对中间件逻辑。

## CLI 与设备授权

CLI 使用 Bearer 个人 Token；安装脚本可打开浏览器，经用户确认后获取凭据。Token 可撤销，服务端保存哈希。见[Token 配置](#nicetool-token-setup)。

```bash
AUTH_ADMIN_GROUPS=nicetool,platform-admin
AUTH_ADMIN_USERS=alice@example.com,bob
AUTH_PROTECTED_PATHS=/user,/admin,/api
AUTH_ADMIN_PATHS=/admin
AUTH_PUBLIC_PATHS=/,/health,/docs,/redoc,/openapi.json,/auth,/api/auth/device/start,/api/auth/device/token,/client/tool
```

设备授权使用 `/api/auth/device/start` 发起授权、`/api/auth/device/token` 轮询结果。若部署中显式设置了 `AUTH_PUBLIC_PATHS`，需同时加入这两个匿名访问路径。浏览器确认页仍为 `/auth/device/authorize`，需要登录；安装脚本使用安装服务下发的环境 URL（含 HTTPS 和部署前缀）拼接浏览器授权链接；目标环境的授权接口无需配置环境列表。

项目访问控制不替代业务数据库权限。工具代码在服务进程内运行，发布账号应限于可信开发者。

    </script>

    <script type="text/markdown" id="doc-zh-CN-nicetool-token-setup">
# Token 配置

[返回文档索引](#README)

## 通过安装脚本授权

[Skill 安装脚本](#nicetool-skill)会打开浏览器，请求用户授权。确认后，凭据保存在 `${XDG_CONFIG_HOME:-$HOME/.config}/nicetool/credentials.env`，权限为 `0600`。客户端配置只保存实例地址和 Token 环境变量名。

## 手工配置

1. 登录目标实例。
2. 打开右上角用户菜单中的 Token 管理。
3. 创建个人 Token，立即保存完整值。
4. 为当前终端配置环境变量。

直接指定 Server 时：

```bash
export NICETOOL_TOKEN='replace-with-your-token'
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py   --server http://localhost:8000 list
```

使用命名环境时，变量名应与该环境配置中的 `token_env` 一致，例如 `NICETOOL_LOCAL_TOKEN`。环境变量只对当前终端及其子进程生效；编辑器或 Agent 需要从配置了变量的环境启动。

## 更新与撤销

Token 丢失后不能取回明文，应重新生成。撤销旧 Token 后，更新本地凭据或环境变量。不应将 Token 写进工具代码、客户端 TOML、提交记录或问题报告。

401 通常表示凭据无效，403 通常表示账号、项目或操作权限不足。更换 Token 不会自动增加账号权限。

    </script>

    <script type="text/markdown" id="doc-zh-CN-contributing">
# 开发与贡献

[返回文档索引](#README)

## 开发环境

```bash
uv sync --locked
uv run main.py
```

服务运行需要 MySQL；测试多使用模拟对象或 SQLite，但导入模块时可能尝试初始化 MySQL 数据源。

```bash
# 忽略工作目录 dotenv，运行测试
ENV_FILE=/dev/null uv run python -m unittest discover -s tests

# Ruff 当前不是项目依赖，使用 uvx 执行
uvx ruff check .
uvx ruff format --check .
```

上述环境变量写法适用于 POSIX Shell。已有代码可能存在格式问题，提交时区分原有问题和本次引入的问题。增加依赖使用 `uv add` 并一并提交 `pyproject.toml`、`uv.lock`，不维护 requirements.txt。

## 项目结构

| 目录 | 职责 |
| --- | --- |
| `core/` | 配置、认证、数据库连接、固定样式与共享运行能力 |
| `models/` | SQLModel 表与数据模型 |
| `service/` | 工具生命周期、存储、项目访问控制等业务逻辑 |
| `public/` | NiceGUI 页面与 FastAPI 路由 |
| `component/` | 共享 UI |
| `plugins/nicetool/` | 分发的 Skill、CLI 和参考资料 |
| `tests/` | 自动化测试 |
| `scripts/init.sql` | 当前完整建表定义 |

页面和 API 都可以调用服务层。数据库操作使用 `db_manager.session_scope()`；管理控制器继承 `BaseController` 并注册到后台入口。页面模块通过 `public/__init__.py` 导入以注册路由。

`tools/` 是运行缓存，不是版本存储。工具入口校验集中在 `service/tool_runtime.py`，元数据解析集中在 `service/tool_metadata.py`。新增行为应复用这些实现，避免再次引入兼容执行分支。

## 提交修改

1. 从维护中的分支创建工作分支，保持修改聚焦。
2. 为行为变化补充能复现问题的测试；文档修改检查链接与示例。
3. 同步受影响文档和 Skill 参考资料。
4. 修改表结构时更新模型和建表脚本，并说明已有数据库如何迁移。
5. 提交前检查 diff，移除真实凭据、日志和业务数据。
6. 在合并请求中描述问题、修改结果、验证步骤和已知限制。

Skill 的正式源是 `plugins/nicetool/skills/nicetool`，`.agents/skills/nicetool` 指向它，不需要维护两份副本。

## 报告问题

通过当前代码托管平台的问题跟踪入口报告。附上提交版本、操作系统、启动方式、复现步骤和脱敏错误日志。当前仓库没有公开仓库地址或许可证声明，文档不假设特定托管平台和贡献协议。

    <script type="text/markdown" id="doc-en-US-project">
# NiceTool



An all-in-one AI tool platform that turns ideas into tools your team can use.

Describe what you need in natural language, let AI build a tool, preview it in your browser, and publish it to your team's tool center. NiceTool brings together data access, tool creation, previewing, debugging, publishing, version management, and access control, so one-off requests can become tools your team maintains and improves over time.

Users can focus on the task and whether the results are correct. Creators describe requirements and refine tools through an AI coding assistant with the NiceTool Skill installed; team members use published tools directly in their browser.

## From an idea to a working tool

1. **Describe the task**: Tell your AI assistant which data to query, what actions to perform, and how to present the results.
2. **Generate a tool**: The assistant uses project context, configured data sources, and development conventions to build it.
3. **Preview and refine**: Open the preview, request changes in natural language, and let the assistant inspect logs to troubleshoot issues.
4. **Publish and share**: Publish the verified tool to the tool center and grant project access to the members who need it.
5. **Keep improving**: Iterate on feedback and use versions and logs to support ongoing maintenance.

An external AI coding assistant and the NiceTool Skill create and modify tools. NiceTool provides the runtime, previews, publishing, and team administration.

## What can you build?

| Use case | Examples |
| --- | --- |
| Data queries | Filter records by order number, status, and date, with paginated results |
| Business operations | Build maintenance forms, batch processing tools, and everyday admin utilities |
| Analytics | Summarize business metrics, create charts and dashboards, and export reports |
| Team collaboration | Publish tools centrally, assign project permissions, and provide a shared entry point |

## Platform capabilities

- **AI-assisted creation**: Turn natural-language requirements into tools with the NiceTool Skill, then refine and debug them through follow-up requests.
- **Publishing workflow**: Preview and verify tools before publishing, with version history, rollback, and logs.
- **Unified tool center**: Organize tools by project and browse, search, filter, and run them in one place.
- **Shared data resources**: Manage MySQL and MongoDB data sources, platform variables, and enums for tools to reuse.
- **Team access management**: Support built-in accounts, OIDC/OAuth2, personal tokens, and per-user project permissions.
- **Read-only analytics**: Use the NiceTool Skill for queries, charts, dashboards, and exports with explicit row limits.

## Try the demo

With Docker and Compose v2 installed, start a complete demo with synthetic data:

```bash
sh scripts/demo.sh
```

Open the [tool center](http://localhost:8000/user) to try an order query, sales dashboard, and quote calculator. You do not need to install Python, prepare a database, or configure a model API key.

Then follow the [complete AI creation walkthrough](#demo) to have your assistant build, refine, and publish a new tool. The demo is accessible only from your local machine and uses synthetic data throughout.

## Create your first AI tool

If you already have a NiceTool instance, [install the NiceTool Skill](#nicetool-skill) in your working project and authorize your account. Then describe your requirements to an AI coding assistant that supports Skills:

> Create an order query tool using the configured order data source. Support filtering by order number, date, and status, and display paginated results. Generate a preview first; do not publish it.

Open the preview URL returned by the assistant, verify the result, and request improvements:

> Add an order amount summary and let me export the current filtered results, up to 1,000 rows.

Once you have verified the tool and the target instance, publish it:

> Publish the verified tool to the orders project and check its published state.

After an administrator grants project access, members can open the tool from the tool center. End users do not need a development environment or programming experience. Publishing requires the appropriate permissions; see [development task examples](#nicetool-skill-usage) for more prompts.

## Deploy your own platform

Prepare Python 3.13+, uv, and an accessible MySQL instance. After downloading this repository, run the following from its root:

```bash
uv sync --locked
```

Create a MySQL database and grant the application account permission to create tables and read and write data in it:

```sql
CREATE DATABASE nicetool CHARACTER SET utf8mb4;
```

Use `.env.example` as a reference to create or edit the root `.env` file. Replace the example values below with your local settings. Back up an existing `.env` before changing it:

```dotenv
HOST=0.0.0.0
PORT=8000
LANGUAGE=en-US
MYSQL_HOST=127.0.0.1
MYSQL_PORT=3306
MYSQL_USER=nicetool
MYSQL_PASSWORD=replace-with-your-password
MYSQL_DATABASE=nicetool
STORAGE_SECRET=replace-with-a-random-secret
AUTH_ENABLED=true
AUTH_JWT_SECRET=replace-with-another-random-secret
```

Generate secrets with `uv run python -c "import secrets; print(secrets.token_urlsafe(32))"`. Do not commit actual credentials to version control. Set `LANGUAGE=en-US` in `.env` to use the English interface; see [internationalization](#internationalization) for details.

```bash
uv run main.py
```

On startup, the application creates missing tables and restores tool caches from the database. Visit the [login page](http://localhost:8000/auth/login) to initialize the administrator account, then use the [admin console](http://localhost:8000/admin) to configure users and data sources.

| Entry point | Default URL |
| --- | --- |
| Home | <http://localhost:8000> |
| Tool center | <http://localhost:8000/user> |
| Admin console | <http://localhost:8000/admin> |
| API documentation | <http://localhost:8000/docs> |
| Health check | <http://localhost:8000/health> |

### Docker deployment

```bash
docker build -t nicetool .
docker run -d --name nicetool --env-file .env -p 8000:8000 nicetool
```

The image includes the platform runtime and installs dependencies with uv using `uv.lock`. Inside the container, `MYSQL_HOST` must point to a database address reachable from that container. The image excludes `.env` and environment-specific configuration; inject settings through environment variables at runtime. See the [deployment guide](#deployment) for persistence, reverse proxy, and upgrade guidance.

## Documentation

Choose a starting point from the [documentation index](#README):

- [Configuration reference](#configuration)
- [User and admin guide](#user-guide)
- [Authentication and project permissions](#oauth2-auth)
- [Tool development](#tool-development)
- [CLI and Skill](#nicetool-skill)
- [API reference](#api)
- [Development and contributing](#contributing)

## Project website

The bilingual static site lives in [`website/`](#project), with real GIFs of preview and tool usage using synthetic data. Codex Desktop creation and publication use explicitly labeled AI-generated illustrations; workspace interactions are real recordings.

```bash
python3 -m http.server 8088 --bind 127.0.0.1 --directory website
```

## Developer notes

The platform uses Python, NiceGUI, FastAPI, and MySQL. Tool source versions are stored in the database, and `tools/` is a rebuildable runtime cache. Tool code executes within the service process, so publishing permissions should be granted to trusted developers.

For manual tool development, platform extensions, or API integration, see [tool development](#tool-development), the [API reference](#api), and the [contributing guide](#contributing).

## Contributing

Issue reports, documentation improvements, and focused code changes are welcome. Include reproduction steps, version information, and sanitized logs when reporting an issue. Add tests and migration notes for behavior changes. The project uses uv for dependency management; see the [contributing guide](#contributing) for commands.

## Topics

`python` · `nicegui` · `fastapi` · `ai-tools` · `ai-agent` · `internal-tools` · `low-code` · `tool-management` · `self-hosted` · `mysql` · `mongodb` · `developer-tools`

    <script type="text/markdown" id="doc-en-US-nicetool-skill">
# CLI and Skill

The NiceTool Skill helps an AI coding agent create, preview, publish, delete, and inspect tools through the NiceTool CLI.

NiceTool tools are single-file Python modules with a top-level `main()` function. Users do not need to think about Python; the platform uses it as the runtime for AI-generated business tools.

## Install the Skill

For an instance with an enabled default client environment, run the installer from your target project after checking that you trust the instance:

```bash
curl -fsSL https://tools.example.com/api/install.sh | sh -s -- --local
```

Use `--global` for a user-level installation, `--target /path/to/project` for a specific project, `--force` to replace an existing Skill, or `--skip-auth` to skip browser authorization. Existing client configuration is preserved. An authenticated instance can open browser device authorization; the demo does not require a token. Environment names, URLs and token-variable names come from the admin environment page.

Alternatively, copy the Skill package into the agent's Skill search directory. Keep scripts and references together; do not copy only `SKILL.md`.

```bash
cp -R plugins/nicetool/skills/nicetool .agents/skills/nicetool
```

## Connect an instance

Use the repository CLI directly:

```bash
export NICETOOL_TOKEN='replace-with-your-token'
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py --server http://localhost:8000 list
```

After installation into a target project, use `.agents/skills/nicetool/scripts/tool-cli.py` as the script path.

For multiple instances, initialize configuration through `/api/init.sh`, then select an environment with `--env <name>` or provide a TOML file with `--config <path>`. Environment name, URL, and `token_env` come from the admin environment page.

## Typical workflow

1. Ask the AI agent to create or modify a tool.
2. The agent writes a NiceTool-compatible tool file.
3. Preview the tool in NiceTool and inspect logs.
4. Publish the approved version.
5. Use version history to roll back or audit changes.

## Recommended tool shape

A tool should be compact, focused, and safe by default. Read-only query and analytics tools should not mutate business data. Configuration should come from NiceTool variables, data sources, and enums instead of hard-coded values.

    </script>

# Development Task Examples

These examples show how to ask an AI agent to create NiceTool tools.

## Query tool

```text
Create a NiceTool tool that queries order data by customer, status, and date range. Show paginated results and support CSV export.
```

## Dashboard

```text
Create a read-only sales dashboard with total revenue, order count, completion rate, monthly trend, and customer ranking.
```

## Form calculator

```text
Create a quote calculator. Users enter quantity, unit price, discount, tax, and service fee. Show subtotal, discount, tax, fee, and final total.
```

## Admin helper

```text
Create a safe admin helper that reads platform variables and displays validation results. Do not write any business data.
```

## Good request style

Include the business goal, required inputs, expected output, data source, safety constraints, and export needs. If the tool must use existing project models or APIs, mention the relevant module or endpoint.

    <script type="text/markdown" id="doc-en-US-demo">
# Demo: What AI Can Create for You

The demo environment is designed to reduce first-use friction for open-source users. It shows what NiceTool can do before users study deployment details.

## What is included

- A one-command demo startup script.
- Demo data for order and sales scenarios.
- Three finished tools: order query, quote calculator, and sales dashboard.
- Examples that demonstrate filters, forms, cards, charts and tables; platform language follows `LANGUAGE` in `.env` (or `.env.example` when absent).
- Seed logic that updates demo tools when their source files change.

## Start the demo

```bash
sh scripts/demo.sh
```

The script starts the application and a MySQL container, initializes demo data, and makes the platform available at `http://127.0.0.1:8000`.

## Demo tools

| Tool | What it demonstrates |
| --- | --- |
| Order query | Search, filters, pagination, status badges, and export-oriented results. |
| Quote calculator | Form input, validation, computed output, and summary cards. |
| Sales dashboard | KPI cards, charts, customer ranking, and read-only analytics. |

## Why this matters

The goal is to let users first experience “AI helped me create a usable business tool,” then learn how to deploy, secure, and extend the platform.

## Restart and reset

Restarting preserves the database volume, but seeding writes a new version when a preset tool differs from its bundled source. It can overwrite edits to the three preset tools. Save custom work under new tool names. Unchanged source is skipped; deleted preset tools are recreated. Existing client environments are retained.

Stop while preserving data:

```bash
docker compose --env-file /dev/null -f compose.demo.yaml down
```

To delete all demo data and changes, explicitly reset the volumes:

```bash
docker compose --env-file /dev/null -f compose.demo.yaml down --volumes
sh scripts/demo.sh
```

The demo disables authentication and uses an isolated database. Its example tools depend on `examples.demo.data`; create tutorial tools inside this repository. Preview first, then publish only after verification. For troubleshooting, run `python3 scripts/doctor.py --server http://localhost:8000`; HTTP health alone does not verify the database or tool behavior.

# User and Admin Guide

NiceTool has two main user surfaces: the tool center for business users and the admin console for platform administrators.

## Tool users

Users open the tool center, search or filter tools, and run tools that they are allowed to access. Tools may provide forms, query pages, dashboards, exports, and logs depending on their implementation.

## Administrators

Administrators manage users, project access, tools, data sources, variables, enums, CLI environments, and preview logs.

## Tool lifecycle

1. Create or update a tool source file.
2. Preview it and validate behavior.
3. Publish a version.
4. Make it available to users by project access.
5. Inspect history and logs when troubleshooting.

## Language

The application language is configured in `.env` with `LANGUAGE`. Supported values are `zh-CN` and `en-US`. Restart the server after changing it.

    <script type="text/markdown" id="doc-en-US-configuration">
# Configuration Reference

NiceTool reads runtime configuration from `.env` through `pydantic-settings`.

## Service and database

| Variable | Default | Description |
| --- | --- | --- |
| `HOST` | `0.0.0.0` | Listen address. |
| `PORT` | `8000` | Listen port. |
| `PROJECT_PATH` | empty | Optional URL mount prefix. |
| `LANGUAGE` | `zh-CN` | Global UI language, `zh-CN` or `en-US`. Restart required. |
| `STORAGE_SECRET` | development value | NiceGUI storage secret. Replace in production. |
| `LOG_LEVEL` | `INFO` | Log level. |
| `TOOLS_DIR` | `./tools` | Rebuildable tool runtime cache directory. |
| `MYSQL_HOST` | `localhost` | Platform database host. |
| `MYSQL_PORT` | `3306` | Platform database port. |
| `MYSQL_USER` | `root` | Database user. |
| `MYSQL_PASSWORD` | empty | Database password. |
| `MYSQL_DATABASE` | `nicetool` | Existing database name. |
| `MYSQL_CHARSET` | `utf8mb4` | Connection charset. |

The platform MySQL database stores tool versions, accounts, and administration configuration. Business data sources used by tools are configured separately in the admin console.

## Authentication

`AUTH_ENABLED` defaults to `false`. When enabled, configure `AUTH_JWT_SECRET`. For HTTPS deployments, set `AUTH_REQUIRE_HTTPS_COOKIE=true`.

## Configuration file selection

Process environment variables override dotenv values. Names are case-insensitive. Restart after changing startup configuration.

- `ENV_FILE` selects one or more comma-separated paths; later files override earlier ones.
- Without `ENV_FILE`, the server loads `.env`, then `.env.${ENV_TYPE}`.
- `ENV_TYPE` defaults to `prod`; supported values are `dev`, `uat` and `prod`. Missing files are not created automatically.
- Use `ENV_FILE=.env uv run main.py` to load only `.env`.

Server `ENV_TYPE` selects startup configuration. CLI `--env` selects a remote instance from client configuration; these are separate settings.

| Variable | Default | Purpose |
| --- | --- | --- |
| `DEBUG` | `false` | Debug mode. |
| `MYSQL_POOL_SIZE` | `10` | Persistent pool connections. |
| `MYSQL_MAX_OVERFLOW` | `20` | Additional pool connections. |
| `MYSQL_POOL_TIMEOUT` | `30` | Seconds waiting for a connection. |
| `MYSQL_POOL_RECYCLE` | `3600` | Seconds before recycling a connection. |
| `REQUEST_TIMEOUT` | `30` | Authentication HTTP timeout in seconds. |

Authentication supports local accounts, OIDC and OAuth2; see [Authentication and permissions](#oauth2-auth). Application styling is fixed in `core/styles.py`; there is no theme preference or generic settings-save page.

    </script>

    <script type="text/markdown" id="doc-en-US-deployment">
# Deployment Guide

## Local startup

Install Python 3.13+, uv and MySQL as described in the [quick start](#project). Create the database, configure `.env`, then run:

```bash
uv sync --locked
uv run main.py
```

Startup creates missing tables; it does not alter existing columns or indexes.

## Docker

The repository `Dockerfile` builds an application image containing the source and locked dependencies in `/opt/venv`.

```bash
docker build -t nicetool .
docker run -d --name nicetool --env-file .env -p 8000:8000 \
  -v nicetool-logs:/app/logs \
  -v nicetool-previews:/tmp/nicegui_client_tools nicetool
```

`.dockerignore` excludes real `.env` files; provide configuration at runtime. The health check follows `PORT` and `PROJECT_PATH`.

Inside a container, `localhost` refers to that container. Use a database service name on the same Docker network or a host address supported by your Docker installation.

## Persistence and recovery

| Data | Storage | Recovery |
| --- | --- | --- |
| Published tool source, versions, accounts and configuration | MySQL | Database backup |
| Tool runtime files | `TOOLS_DIR` | Rebuilt from MySQL |
| Preview source and logs | `/tmp/nicegui_client_tools` | Preview again or persist a volume |
| Application and tool logs | `logs/` | Persist a volume or use external logging |

Backing up only `tools/` cannot restore the platform. Keep database backups and runtime configuration and secrets separately.

## Reverse proxy and subpaths

For `PROJECT_PATH=/nicetool`, preserve the prefix and support WebSockets. Forward the external host and protocol. OAuth callback URLs must include the prefix, for example `https://tools.example.com/nicetool/auth/callback`.

Set independent `STORAGE_SECRET` and `AUTH_JWT_SECRET` values. Enable authentication for shared deployments and use `AUTH_REQUIRE_HTTPS_COOKIE=true` over HTTPS.

## Upgrades and execution boundary

Back up the database and configuration, record the current version, review schema changes, stop the old instance and apply verified migrations before starting the new image. `scripts/init.sql` is a complete schema, not an incremental migration tool. See [Upgrade and recovery](#upgrading).

Tools execute inside the service process. Grant publishing permissions to trusted developers. Preview files and runtime caches are local; multiple service instances require storage and routing design.

For a disposable first experience, use the [demo](#demo).

    </script>

    <script type="text/markdown" id="doc-en-US-upgrading">
# Upgrade and Recovery

This document describes a conservative upgrade path for existing NiceTool instances.

## Before upgrading

1. Back up the MySQL database.
2. Back up runtime configuration and secrets. MySQL contains published tool source and versions; local runtime files are rebuildable caches.
3. Record the current commit, image tag, and `.env` values.
4. Read release notes for configuration or schema changes.

## Upgrade steps

```bash
git pull
uv sync --locked
uv run main.py
```

For Docker deployments, rebuild the image and restart the container with the same `.env` file.

Startup table creation does not migrate existing columns or indexes. Review `models/` and `scripts/init.sql`, test the required migration against an isolated database, then stop the old instance before applying it. The complete schema script is not an incremental migration tool.

For the demo, restarting can restore changed preset sources as new versions; save custom work under other tool names. See [Demo](#demo).

## Recovery

If startup fails, restore the previous image or commit and the database backup. Check `logs/app.log` and `logs/error.log` for the failing migration, configuration, or dependency.

## Current development contract

The project has not launched. Update the server, CLI, Skill and documentation together without preserving obsolete behavior. Publishing requires uploaded source and tool names are strictly validated; see [API reference](#api).

    </script>

    <script type="text/markdown" id="doc-en-US-tool-development">
# Tool Development

A NiceTool tool is a Python file with a top-level synchronous or asynchronous `main()` function callable without arguments. The function renders the UI and handles user interaction.

## Minimal tool

```python
from nicegui import ui


def main():
    ui.label("Hello from NiceTool")
```

## Metadata

Tool files may include metadata in the module docstring:

```python
"""name: Order query
description: Search orders and export filtered results
tags: demo,query,export
"""
```

## Guidelines

- Keep one tool focused on one business task.
- Validate user input before querying or computing.
- Use platform data sources and variables for environment-specific values.
- Keep logs useful for preview and troubleshooting.
- Prefer read-only behavior unless the workflow is explicitly designed to write data.

## Tool names and source contract

Project and tool identifiers accept only lowercase ASCII letters, digits, underscores and hyphens. Project names have a maximum length of 100 characters; tool names have a maximum length of 197 and exclude `.py`. Names are validated as supplied: uppercase, whitespace and extensions are rejected with HTTP 422 rather than rewritten. Display titles may use other languages.

Publishing requires Python source with a top-level `main()`. `POST /api/tools/{project}/{name}/publish` requires a JSON body containing `{"content": "..."}`. Missing bodies, missing content and empty strings return HTTP 422; syntax and entry-point errors return HTTP 400. The CLI uploads `tools/{project}/{name}.py` by default, or reads `--file` / `--stdin`. The server never infers publication content from an existing database version or runtime cache.

MySQL stores published source and versions; local `tools/` files are recoverable runtime caches. Restore historical source through version rollback in the admin UI, which creates a new version. Tool details have no revision field and CLI `get --output` writes only the source file. Optimistic concurrency protection is not provided.


Keep UI construction inside `main()`. Only call `ui.run()` in a local `if __name__ == "__main__":` block. Importing a module runs its top-level statements, so avoid network calls and writes there. Tools without `main()` are rejected.

Shared resources are exposed through `core.datasource_manager`, `core.variable_manager` and `core.enum_config`. Have an administrator configure them first; do not hard-code real passwords or tokens. Preview execution runs real Python and does not roll back business data writes.

    </script>

# API Navigation

NiceTool exposes FastAPI routes for tools, data sources, previews, initialization, and client integration.

## API documentation

When the server is running, open:

- Swagger UI: `http://localhost:8000/docs`
- ReDoc: `http://localhost:8000/redoc`

## Common route groups

| Group | Purpose |
| --- | --- |
| `/api/tools` | Tool list, details, previews, publishing, state, logs and deletion. |
| `/api/datasources` | Data source list, details and connection testing. |
| `/client/tool/{token}` | Temporary preview page. |
| `/client/tool/{username}/{tool_name}` | Fixed preview page. |
| `/api/variables` | Variable key metadata. |
| `/api/init.sh`, `/api/install.sh` | Client initialization and Skill installation scripts. |
| `/api/downloads` | Skill archive downloads. |
| `/auth`, `/api/auth/device` | Login, personal tokens and device authorization. |

Use the interactive API pages for exact request and response schemas. Add `PROJECT_PATH` when using a URL prefix. Not every admin operation has a REST endpoint: data source writes and version rollback are handled by admin services, not generic CRUD routes.

Create a temporary preview with `POST /api/tools/preview`, or a fixed preview with `POST /api/tools/preview/{username}/{tool_name}`. Both take JSON with `content`. Fixed preview ownership and the preview scope are checked when authentication is enabled. Preview pages are public by default; project permissions do not make their URLs private.

## Tool names and source contract

Project and tool identifiers accept only lowercase ASCII letters, digits, underscores and hyphens. Project names have a maximum length of 100 characters; tool names have a maximum length of 197 and exclude `.py`. Names are validated as supplied: uppercase, whitespace and extensions are rejected with HTTP 422 rather than rewritten. Display titles may use other languages.

Publishing requires Python source with a top-level `main()`. `POST /api/tools/{project}/{name}/publish` requires a JSON body containing `{"content": "..."}`. Missing bodies, missing content and empty strings return HTTP 422; syntax and entry-point errors return HTTP 400. The CLI uploads `tools/{project}/{name}.py` by default, or reads `--file` / `--stdin`. The server never infers publication content from an existing database version or runtime cache.

MySQL stores published source and versions; local `tools/` files are recoverable runtime caches. Restore historical source through version rollback in the admin UI, which creates a new version. Tool details have no revision field and CLI `get --output` writes only the source file. Optimistic concurrency protection is not provided.

# Internationalization

NiceTool supports Chinese and English UI text.

## Application language

Set the language in `.env`:

```env
LANGUAGE=en-US
```

Supported values:

- `zh-CN`
- `en-US`

Restart the server after changing the value.

## Translation files

Runtime translations are stored under `core/i18n/`. UI code should wrap visible text with the translation helper so pages can render in the configured language.

## Static website

The static website uses a browser-side language switcher. It stores the selected language in `localStorage`. The docs page embeds both Chinese and English Markdown content during build.

    <script type="text/markdown" id="doc-en-US-oauth2-auth">
# Authentication and Project Permissions

NiceTool can run without authentication for local demos, or with local accounts, OIDC or OAuth2 authentication for shared deployments.

## Authentication switch

`AUTH_ENABLED=false` keeps the instance open for local development and demos. For shared environments, enable authentication. External provider settings are needed only when using external login.

## Required production settings

- `AUTH_ENABLED=true`
- `AUTH_JWT_SECRET` with a strong secret value
- `AUTH_REQUIRE_HTTPS_COOKIE=true` when serving over HTTPS

## Project access

Users can be assigned access to projects. The tool center shows tools according to the current user's project permissions. Administrators can enter the admin console from the user menu.

## Notes

Keep OAuth client secrets and JWT secrets out of source control. Use `.env` or your deployment platform's secret manager.

## Local accounts and session lifecycle

When no local password account exists, `/auth/login` offers administrator initialization. Administrators create subsequent accounts; temporary passwords must be changed on first login. Web sessions use short-lived JWTs in HttpOnly cookies; there is no refresh token. CLI clients use revocable personal Bearer tokens or browser device authorization.

## Provider and operation scopes

Use `AUTH_PROVIDER_PROFILE=oidc` with issuer discovery and JWKS, or `oauth2` with explicit authorization, token and userinfo endpoints. Callback URLs must include `PROJECT_PATH`. Claim mapping and verified-email settings determine external account binding. See `core/settings.py` for field names.

Project access and operation scopes are separate. Ordinary users default to read and preview on assigned projects; administrators can also publish, roll back and delete. A token is further restricted by its issued scopes. Project access alone does not grant publication rights.

Device authorization starts at `/api/auth/device/start` and polls `/api/auth/device/token`. Include both in custom `AUTH_PUBLIC_PATHS`; the browser confirmation page `/auth/device/authorize` requires login. Preview pages under `/client/tool` are public by default and should not be treated as private data isolation.

# Token Setup

The NiceTool CLI uses a token to authenticate against a server instance.

## Environment variable

```bash
export NICETOOL_TOKEN='replace-with-your-token'
```

Use the token variable configured for the selected CLI environment. Token values are not distributed by the initialization script; only token variable names are shared.

## Multiple environments

Initialize CLI configuration from the server, then select an environment:

```bash
uv run python plugins/nicetool/skills/nicetool/scripts/tool-cli.py --env demo list
```

You can also provide a TOML file explicitly with `--config <path>`.

# Development and Contributing

NiceTool uses Python 3.13+, uv, NiceGUI, FastAPI, SQLModel, MySQL, and ruff.

## Setup

```bash
uv sync
```

## Run

```bash
uv run main.py
```

## Checks

```bash
ruff check
ruff format
uv run python -m unittest discover -s tests
```

## Contribution guidelines

- Keep UI changes consistent with the existing theme and layout.
- Use `session_scope()` for database operations.
- Add or update tests when behavior changes.
- Avoid committing local `.env` files or secrets.
- Keep generated website docs in sync by running `uv run python scripts/build_website_docs.py` after documentation changes.

    </script>

    <script>
      const titles = {
        'zh-CN': {'project': '项目介绍与快速开始', 'README': 'NiceTool 文档', 'nicetool-skill': 'CLI 与 Skill', 'nicetool-skill-usage': '开发任务示例', 'demo': '先体验：AI 可以帮你创建什么', 'user-guide': '用户与管理员指南', 'configuration': '配置参考', 'deployment': '部署指南', 'upgrading': '升级与恢复', 'tool-development': '工具开发', 'api': 'API 导航', 'internationalization': '国际化', 'oauth2-auth': '认证与项目权限', 'nicetool-token-setup': 'Token 配置', 'contributing': '开发与贡献'},
        'en-US': {'project': 'Overview and quick start', 'README': 'NiceTool Documentation', 'nicetool-skill': 'CLI and Skill', 'nicetool-skill-usage': 'Development Task Examples', 'demo': 'Demo: What AI Can Create for You', 'user-guide': 'User and Admin Guide', 'configuration': 'Configuration Reference', 'deployment': 'Deployment Guide', 'upgrading': 'Upgrade and Recovery', 'tool-development': 'Tool Development', 'api': 'API Navigation', 'internationalization': 'Internationalization', 'oauth2-auth': 'Authentication and Project Permissions', 'nicetool-token-setup': 'Token Setup', 'contributing': 'Development and Contributing'}
      };
      const defaultDoc = 'project';
      let currentDoc = defaultDoc;
      let currentLanguage = 'zh-CN';
      const escapeHtml = (value) => value.replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
      const inline = (text) => escapeHtml(text)
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<span>$1</span>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      function renderMarkdown(markdown) {
        const lines = markdown.trim().split('\n');
        let html = '';
        let inCode = false;
        let code = [];
        let list = [];
        let table = [];
        const flushList = () => {
          if (!list.length) return;
          html += '<ul>' + list.map((item) => `<li>${inline(item)}</li>`).join('') + '</ul>';
          list = [];
        };
        const flushTable = () => {
          if (table.length < 2) { table = []; return; }
          const rows = table.map((row) => row.split('|').slice(1, -1).map((cell) => cell.trim()));
          const header = rows[0];
          const body = rows.slice(2);
          html += '<div class="table-scroll"><table><thead><tr>' + header.map((cell) => `<th>${inline(cell)}</th>`).join('') + '</tr></thead><tbody>';
          html += body.map((row) => '<tr>' + row.map((cell) => `<td>${inline(cell)}</td>`).join('') + '</tr>').join('');
          html += '</tbody></table></div>';
          table = [];
        };
        const flushBlocks = () => { flushList(); flushTable(); };
        for (const rawLine of lines) {
          const line = rawLine.trimEnd();
          if (line.startsWith('```')) {
            flushBlocks();
            if (inCode) {
              html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;
              code = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }
          if (inCode) { code.push(rawLine); continue; }
          if (!line.trim()) { flushBlocks(); continue; }
          if (/^\|.*\|$/.test(line)) { flushList(); table.push(line); continue; }
          flushTable();
          if (line.startsWith('# ')) { flushList(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
          if (line.startsWith('## ')) { flushList(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
          if (line.startsWith('### ')) { flushList(); html += `<h3>${inline(line.slice(4))}</h3>`; continue; }
          if (line.startsWith('#### ')) { flushList(); html += `<h4>${inline(line.slice(5))}</h4>`; continue; }
          if (/^[-*] /.test(line)) { list.push(line.slice(2)); continue; }
          if (/^\d+\. /.test(line)) { list.push(line.replace(/^\d+\. /, '')); continue; }
          if (line.startsWith('> ')) { flushList(); html += `<blockquote>${inline(line.slice(2))}</blockquote>`; continue; }
          flushList();
          html += `<p>${inline(line)}</p>`;
        }
        flushBlocks();
        return html;
      }

      function showDoc(name) {
        currentDoc = titles[currentLanguage][name] ? name : defaultDoc;
        const source = document.getElementById(`doc-${currentLanguage}-${currentDoc}`);
        document.getElementById('doc-title').textContent = titles[currentLanguage][currentDoc];
        document.getElementById('content').innerHTML = renderMarkdown(source.textContent);
        document.querySelectorAll('.doc-link').forEach((link) => {
          const active = link.dataset.doc === currentDoc;
          link.classList.toggle('active', active);
          if (active) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
        });
        document.querySelector('.directory-toggle').setAttribute('aria-expanded', 'false');
        document.querySelector('.docs-directory').classList.remove('open');
        document.title = `${titles[currentLanguage][currentDoc]} — NiceTool`;
        history.replaceState(null, '', `#${currentDoc}`);
      }

      const messages = {
        'zh-CN': { skip:'跳至内容', directory:'文档目录', 'nav.demos':'流程演示', 'nav.workflow':'如何工作', 'nav.docs':'使用文档', 'nav.start':'开始体验 ↗' },
        'en-US': { skip:'Skip to content', directory:'Documentation', 'nav.demos':'See it in action', 'nav.workflow':'How it works', 'nav.docs':'Documentation', 'nav.start':'Get started ↗' }
      };
      function setLanguage(lang) {
        currentLanguage = messages[lang] ? lang : 'zh-CN';
        document.documentElement.lang = currentLanguage;
        document.querySelectorAll('[data-i18n]').forEach((node) => {
          node.textContent = messages[currentLanguage][node.dataset.i18n] || node.textContent;
        });
        document.querySelectorAll('[data-doc-title]').forEach((node) => {
          node.textContent = titles[currentLanguage][node.dataset.docTitle] || node.textContent;
        });
        const toggle = document.querySelector('[data-language-toggle]');
        toggle.textContent = currentLanguage === 'en-US' ? '中文' : 'EN';
        toggle.setAttribute('aria-label', currentLanguage === 'en-US' ? '切换为中文' : 'Switch to English');
        document.querySelector('.docs-directory').setAttribute('aria-label', messages[currentLanguage].directory);
        try { localStorage.setItem('nicetool-website-language', currentLanguage); } catch { /* Optional preference. */ }
        showDoc(currentDoc);
      }

      document.querySelector('[data-language-toggle]').addEventListener('click', () => setLanguage(currentLanguage === 'zh-CN' ? 'en-US' : 'zh-CN'));
      document.querySelector('.directory-toggle').addEventListener('click', (event) => {
        const open = document.querySelector('.docs-directory').classList.toggle('open');
        event.currentTarget.setAttribute('aria-expanded', String(open));
      });
      document.querySelector('.menu-toggle').addEventListener('click', (event) => {
        const open = document.getElementById('nav-links').classList.toggle('open');
        event.currentTarget.setAttribute('aria-expanded', String(open));
      });
      document.querySelectorAll('.doc-link').forEach((link) => link.addEventListener('click', () => showDoc(link.dataset.doc)));
      document.getElementById('content').addEventListener('click', (event) => {
        const anchor = event.target.closest('a');
        if (!anchor) return;
        const href = anchor.getAttribute('href');
        if (href && href.startsWith('#') && titles[currentLanguage][href.slice(1)]) {
          event.preventDefault();
          showDoc(href.slice(1));
        }
      });
      window.addEventListener('hashchange', () => {
        const slug = decodeURIComponent(location.hash.slice(1));
        if (titles[currentLanguage][slug]) showDoc(slug);
      });
      currentDoc = decodeURIComponent(location.hash.slice(1)) || defaultDoc;
      let savedLanguage;
      try { savedLanguage = localStorage.getItem('nicetool-website-language'); } catch { /* Optional preference. */ }
      setLanguage(savedLanguage || (navigator.language.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en-US'));
    </script>
  </body>
</html>
